name: Probe Original Drive Download
on:
  push:
    branches: [ main ]
    paths: [".github/workflows/probe-original-drive.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe first megabyte
        run: |
          set -euxo pipefail
          URL='https://drive.usercontent.google.com/download?id=1ov6ggWc__WXLzMxePESUStjRg5MmhtbX&export=download&confirm=t'
          curl -fL --retry 2 --retry-all-errors --max-time 60 -r 0-1048575 "$URL" -o probe.bin
          wc -c probe.bin
          file probe.bin
