name: Prepare Exact FFH Android Assets

on:
  push:
    branches: [ main ]
    paths: [".github/workflows/prepare-full-android-assets.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full dotnet-sdk-8.0 git curl

      - name: Download exact original source
        run: |
          set -euxo pipefail
          URL='https://drive.usercontent.google.com/download?id=1ov6ggWc__WXLzMxePESUStjRg5MmhtbX&export=download&confirm=t'
          curl -fL --retry 6 --retry-all-errors --retry-delay 3 "$URL" -o outer.zip
          test "$(stat -c %s outer.zip)" = "4882324669"
          mkdir -p outer
          7z x -y outer.zip -oouter 'Femboy_Futa_House/FEMBOY FUTA HOUSE-v1.177.zip'
          INNER="$(find outer -type f -iname 'FEMBOY FUTA HOUSE-v1.177.zip' -print -quit)"
          test -n "$INNER"
          test "$(stat -c %s "$INNER")" = "3659065573"
          mv "$INNER" inner.zip
          rm -rf outer outer.zip

      - name: Extract exact full player data
        env:
          PASS: Downloaded from Porno-Island
        run: |
          set -euxo pipefail
          mkdir -p work
          BASE='FEMBOY FUTA HOUSE-v1.177/Femboy Futa House_Data'
          7z x -y -p"$PASS" inner.zip -owork             "$BASE/globalgamemanagers"             "$BASE/globalgamemanagers.assets"             "$BASE/globalgamemanagers.assets.resS"             "$BASE/resources.assets"             "$BASE/resources.assets.resS"             "$BASE/resources.resource"             "$BASE/level*"             "$BASE/sharedassets*.assets"             "$BASE/sharedassets*.assets.resS"             "$BASE/sharedassets*.resource"             "$BASE/boot.config"             "$BASE/app.info"             "$BASE/RuntimeInitializeOnLoads.json"             "$BASE/ScriptingAssemblies.json"             "$BASE/Resources/unity_builtin_extra"             "$BASE/StreamingAssets/aa/catalog.bin"             "$BASE/StreamingAssets/aa/catalog.hash"             "$BASE/StreamingAssets/aa/settings.json"             "$BASE/StreamingAssets/aa/StandaloneWindows64/*"
          DATA="work/$BASE"
          test -f "$DATA/globalgamemanagers"
          test -f "$DATA/level8"
          test -f "$DATA/sharedassets8.assets"
          test -d "$DATA/StreamingAssets/aa/StandaloneWindows64"
          test "$(sha256sum "$DATA/globalgamemanagers" | cut -d' ' -f1)" = "83adf9e6b3c7eaac72f402f2f044fe459dbed298d84b087d4b45fc581e6f5950"
          test "$(sha256sum "$DATA/StreamingAssets/aa/catalog.bin" | cut -d' ' -f1)" = "0389bc99f2e5fbb984196dcd56fde29ae87b5bd95b2243d4b4ca641e39dec4ab"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          rm -f inner.zip
          echo "bundles=$(find "$DATA/StreamingAssets/aa/StandaloneWindows64" -type f -name '*.bundle' | wc -l)"
          du -sh "$DATA"

      - name: Build BundleSurgery
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/jakobkhansen/SilksongAndroid.git surgery-src
          dotnet build surgery-src/tools/bundle-surgery/BundleSurgery.csproj -c Release
          BS="$(find surgery-src/tools/bundle-surgery/bin/Release -name BundleSurgery.dll -print -quit)"
          test -s "$BS"
          echo "BS=$BS" >> "$GITHUB_ENV"

      - name: Retarget Addressables to Android
        run: |
          set -euxo pipefail
          AA="$DATA/StreamingAssets/aa/StandaloneWindows64"
          dotnet "$BS" retarget-tree "$AA" "$AA" 2>&1 | tee retarget-addressables.log

      - name: Retarget player serialized files
        run: |
          set -euxo pipefail

          # Serialized *.assets: set Android target and keep Vulkan slice when present.
          for F in globalgamemanagers.assets resources.assets sharedassets{0..8}.assets; do
            [ -f "$DATA/$F" ] || continue
            dotnet "$BS" extract-vulkan-android "$DATA/$F" "$DATA/$F.android" 2>&1 | tee -a retarget-core.log
            mv "$DATA/$F.android" "$DATA/$F"
          done

          # BuildSettings must select Vulkan.
          dotnet "$BS" set-graphics-apis "$DATA/globalgamemanagers" 21 2>&1 | tee -a retarget-core.log

          # Raw serialized files without .assets extension: stamp targetPlatform=Android (13).
          python3 - <<'PY'
          import os, struct
          from pathlib import Path
          root=Path(os.environ["DATA"])
          files=[root/"globalgamemanagers", root/"Resources/unity_builtin_extra"]
          files += [root/f"level{i}" for i in range(9)]
          for p in files:
              if not p.is_file(): continue
              b=bytearray(p.read_bytes())
              i=48
              while i < len(b) and b[i] != 0: i += 1
              if i+5 > len(b): raise SystemExit(f"{p}: version string not found")
              b[i+1:i+5]=struct.pack("<i",13)
              p.write_bytes(b)
              print("Android target:",p)
          PY

          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ["DATA"])/"boot.config"
          lines=[x for x in p.read_text(errors="ignore").splitlines() if not x.startswith("scripting-backend=")]
          lines.append("scripting-backend=il2cpp")
          p.write_text("\n".join(lines)+"\n")
          PY

      - name: Inventory exact Android assets
        run: |
          set -euxo pipefail
          find "$DATA" -type f -printf '%P %s\n' | sort > full-files.txt
          sha256sum             "$DATA/globalgamemanagers"             "$DATA/globalgamemanagers.assets"             "$DATA/resources.assets"             "$DATA/sharedassets0.assets"             "$DATA/StreamingAssets/aa/catalog.bin" > core-sha256.txt
          du -sh "$DATA"
          find "$DATA/StreamingAssets/aa/StandaloneWindows64" -type f -name '*.bundle' | wc -l

      - name: Pack into 180 MB chunks
        run: |
          set -euxo pipefail
          mkdir -p chunks
          tar -C "$DATA" -cf - . | split -b 180M -d -a 2 - chunks/ffh-exact-android-assets.tar.part-
          ls -lh chunks
          sha256sum chunks/* > chunks.sha256
          PARTS="$(find chunks -type f | wc -l)"
          echo "PARTS=$PARTS"
          test "$PARTS" -le 30

      - uses: actions/upload-artifact@v4
        with:
          name: ffh-exact-assets-part-00
          path: chunks/ffh-exact-android-assets.tar.part-00
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ffh-exact-assets-part-01
          path: chunks/ffh-exact-android-assets.tar.part-01
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
