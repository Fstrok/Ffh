          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ffh-assets-manifest
          path: |
            chunks.sha256
            full-files.txt
            core-sha256.txt
            retarget-addressables.log
            retarget-core.log
          retention-days: 7
