name: Fast Extract Unity Android Mono Player
on:
  push:
    branches: [ main ]
    paths: [".github/workflows/unity-cli-player-fast.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  player:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Unity CLI and Android module
        run: |
          set -euxo pipefail
          curl -fsSL https://unity.com/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          unity --version
          mkdir -p "$HOME/UnityEditors"
          unity install-path set "$HOME/UnityEditors"
          unity install 6000.2.6f2 -m android --no-child-modules --yes --accept-eula
      - name: Inventory Android player
        run: |
          set -euxo pipefail
          ROOT="$(find "$HOME/UnityEditors" -type d -path '*/PlaybackEngines/AndroidPlayer' -print -quit)"
          test -n "$ROOT"
          echo "$ROOT" > android-root.txt
          find "$ROOT" -type f -printf '%p %s\n' | sort > android-files.txt
          grep -Ei 'Variations|mono|libunity|libmain|libmono|gradle|classes\.jar|UnityPlayer|AndroidManifest|template|launcher|unityLibrary' android-files.txt > android-interesting.txt || true
          sed -n '1,5000p' android-interesting.txt
      - name: Pack key files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path(open("android-root.txt").read().strip())
          out=Path("player")
          keys=("variations/mono","gradle","unityplayer","classes.jar","androidmanifest",
                "template","launcher","unitylibrary","libmono","libunity","libmain")
          for p in root.rglob("*"):
              if not p.is_file(): continue
              rel=p.relative_to(root)
              low=str(rel).lower()
              if not any(k in low for k in keys): continue
              if p.suffix.lower() in {".dbg",".sym",".pdb"}: continue
              q=out/rel; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q)
          PY
          cp android-files.txt player/
          cp android-interesting.txt player/
          tar -czf unity-android-mono-player-fast.tgz player
          du -sh player unity-android-mono-player-fast.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: unity-android-mono-player-fast
          path: unity-android-mono-player-fast.tgz
          retention-days: 7
