name: Prepare Android NDK r27c Exact

on:
  push:
    branches: [ main ]
    paths: [".github/workflows/prepare-ndk.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ndk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download exact NDK r27c
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 3             https://dl.google.com/android/repository/android-ndk-r27c-linux.zip             -o ndk.zip
          test "$(stat -c %s ndk.zip)" = "663987688"
          echo "090e8083a715fdb1a3e402d0763c388abb03fb4e  ndk.zip" | sha1sum -c -

      - name: Pack minimal r27c ARM64 toolchain
        run: |
          set -euxo pipefail
          unzip -q ndk.zip -d raw
          P=raw/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64
          test -x "$P/bin/clang"
          O=ndk-r27c
          mkdir -p "$O/bin" "$O/lib"
          cp -a "$P/sysroot" "$O/"
          cp -a "$P/lib/clang" "$O/lib/"
          for x in clang clang++ ld.lld lld llvm-ar llvm-ranlib llvm-strip llvm-readelf; do
            [ -e "$P/bin/$x" ] && cp -aL "$P/bin/$x" "$O/bin/$x"
          done
          "$P/bin/clang++" --version | tee "$O/version.txt"
          grep -q "clang version 18" "$O/version.txt"
          du -sh "$O"
          tar -cJf android-ndk-r27c-min.tar.xz "$O"
          ls -lh android-ndk-r27c-min.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: android-ndk-r27c-exact
          path: android-ndk-r27c-min.tar.xz
          compression-level: 0
          retention-days: 7
