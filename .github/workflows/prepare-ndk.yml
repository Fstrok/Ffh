name: Prepare Android NDK subset

on:
  push:
    branches: [ main ]
    paths: [".github/workflows/prepare-ndk.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ndk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Locate NDK
        run: |
          set -euxo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT/ndk" || true
          NDK="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          cat "$NDK/source.properties"

      - name: Pack minimal Linux host ARM64 toolchain
        run: |
          set -euxo pipefail
          P="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          O=ndk-min
          mkdir -p "$O/bin" "$O/lib" "$O/sysroot"
          for f in clang clang++ ld.lld llvm-ar llvm-ranlib llvm-strip; do
            cp -L "$P/bin/$f" "$O/bin/$f"
          done
          # Clang builtin headers/libraries.
          cp -a "$P/lib/clang" "$O/lib/"
          # Android headers and target libraries, including libc++.
          cp -a "$P/sysroot/usr" "$O/sysroot/"
          # Small wrapper names are useful for build scripts.
          for api in 26 28 33 35; do
            [ -e "$P/bin/aarch64-linux-android$api-clang" ] && cp -L "$P/bin/aarch64-linux-android$api-clang" "$O/bin/aarch64-linux-android$api-clang"
            [ -e "$P/bin/aarch64-linux-android$api-clang++" ] && cp -L "$P/bin/aarch64-linux-android$api-clang++" "$O/bin/aarch64-linux-android$api-clang++"
          done
          find "$O" -type f -printf '%p %s\n' | sort > ndk-files.txt
          du -sh "$O"
          tar -cJf android-ndk-arm64-min.tar.xz "$O"
          ls -lh android-ndk-arm64-min.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: android-ndk-arm64-min
          path: android-ndk-arm64-min.tar.xz
          compression-level: 0
          retention-days: 7
