name: Inspect Unity Android Player 6000.2.6f2

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/inspect-android-player.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full file tree

      - name: Download official Android Build Support
        run: |
          mkdir -p work
          curl -fL --retry 3             "https://download.unity3d.com/download_unity/4a4dcaec6541/TargetSupportInstaller/UnitySetup-Android-Support-for-Editor-6000.2.6f2.exe"             -o work/android-support.exe
          ls -lh work/android-support.exe
          file work/android-support.exe
          7z l work/android-support.exe > work/installer-list.txt
          head -100 work/installer-list.txt

      - name: Extract module
        run: |
          mkdir -p work/android-support
          7z x -y work/android-support.exe -owork/android-support > work/extract.log
          du -sh work/android-support
          echo "=== top-level extracted ==="
          find work/android-support -maxdepth 2 -type f -printf '%p %s bytes\n'
          PAYLOAD="$(find work/android-support -maxdepth 1 -type f -name '[[]0[]]' -print -quit)"
          if [ -n "$PAYLOAD" ]; then
            echo "=== payload info ==="
            file "$PAYLOAD" || true
            xxd -l 128 "$PAYLOAD" || true
            7z l "$PAYLOAD" > work/payload-list.txt 2>&1 || true
            head -120 work/payload-list.txt || true
            mkdir -p work/payload
            7z x -y "$PAYLOAD" -owork/payload > work/payload-extract.log 2>&1 || true
            du -sh work/payload || true
          fi
          find work/android-support work/payload -type f 2>/dev/null > work/all-files.txt
          grep -Ei             'AndroidPlayer|Variations|mono|il2cpp|armv7|arm64|libunity|libmain|gradle|launcher|unityLibrary|classes.jar|UnityPlayer'             work/all-files.txt > work/interesting-files.txt || true
          wc -l work/all-files.txt work/interesting-files.txt
          sed -n '1,1000p' work/interesting-files.txt

      - name: Extract NSISBI payload with Unity extractor
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/kmod-midori/unity-nsisbi-ext.git work/nsisbi-ext
          cargo build --release --manifest-path work/nsisbi-ext/Cargo.toml
          mkdir -p work/unity-player-files
          set +e
          work/nsisbi-ext/target/release/nsisbi-ext \
            --regex '(?i)(AndroidPlayer|PlaybackEngines|Variations|libunity|libmain|mono|il2cpp|gradle|classes\\.jar|UnityPlayer)' \
            work/android-support.exe work/unity-player-files
          NSISBI_RC=$?
          set -e
          echo "unity-nsisbi-ext rc=$NSISBI_RC"

          git clone --depth 1 https://github.com/KokerZhou/NSISExtractor.git work/NSISExtractor
          python3 -m pip install --break-system-packages work/NSISExtractor
          rm -rf work/unity-player-files
          mkdir -p work/unity-player-files
          nsisextract --info work/android-support.exe | tee work/nsis-info.txt
          nsisextract --list work/android-support.exe > work/nsis-list.txt
          nsisextract --output-dir work/unity-player-files work/android-support.exe

          du -sh work/unity-player-files
          find work/unity-player-files -type f -printf '%p %s\n' | sort > work/nsisbi-files.txt
          grep -Ei 'AndroidPlayer|PlaybackEngines|Variations|libunity|libmain|mono|il2cpp|gradle|classes\\.jar|UnityPlayer' work/nsisbi-files.txt > work/nsisbi-interesting.txt || true
          sed -n '1,3000p' work/nsisbi-interesting.txt

      - name: Make compact player inventory
        run: |
          mkdir -p work/report
          cp work/installer-list.txt work/report/
          cp work/interesting-files.txt work/report/
          cp work/extract.log work/report/
          cp work/payload-list.txt work/report/ 2>/dev/null || true
          cp work/payload-extract.log work/report/ 2>/dev/null || true
          cp work/nsisbi-files.txt work/report/ 2>/dev/null || true
          cp work/nsisbi-interesting.txt work/report/ 2>/dev/null || true
          cp work/nsis-info.txt work/report/ 2>/dev/null || true
          cp work/nsis-list.txt work/report/ 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import json, os, hashlib
          roots=[Path("work/android-support"),Path("work/unity-player-files")]
          out=[]
          keys=("libunity","libmain","mono","il2cpp","gradle","classes.jar","unityplayer","androidplayer","launcher")
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob("*"):
                  if not p.is_file(): continue
                  low=str(p).lower()
                  if any(k in low for k in keys):
                      st=p.stat()
                      out.append({"root":str(root),"path":str(p.relative_to(root)),"size":st.st_size})
          Path("work/report/player-files.json").write_text(json.dumps(out,indent=2),encoding="utf-8")
          PY
          tar -C work -czf work/unity-android-player-inventory.tgz report

      - uses: actions/upload-artifact@v4
        with:
          name: unity-android-player-inventory
          path: work/unity-android-player-inventory.tgz
          retention-days: 7
