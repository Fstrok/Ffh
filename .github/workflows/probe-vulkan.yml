name: Probe FFH Vulkan Retarget

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/probe-vulkan.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full python3-pip dotnet-sdk-8.0 git
          python3 -m pip install --break-system-packages --upgrade gdown
      - name: Download FFH
        run: |
          set -euxo pipefail
          mkdir -p work/outer work/game
          gdown "https://drive.google.com/file/d/1ov6ggWc__WXLzMxePESUStjRg5MmhtbX/view?usp=drivesdk" -O work/outer.zip
          7z x -y work/outer.zip -owork/outer 'Femboy_Futa_House/FEMBOY FUTA HOUSE-v1.177.zip'
          INNER="$(find work/outer -type f -iname 'FEMBOY FUTA HOUSE-v1.177.zip' -print -quit)"
          7z x -y -p'Downloaded from Porno-Island' "$INNER" -owork/game
          DATA="$(find work/game -type d -name 'Femboy Futa House_Data' -print -quit)"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          rm -rf work/outer work/outer.zip
      - name: Build bundle-surgery
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/jakobkhansen/SilksongAndroid.git work/ss
          dotnet build work/ss/tools/bundle-surgery/BundleSurgery.csproj -c Release
          BS="$(find work/ss/tools/bundle-surgery/bin/Release -name BundleSurgery.dll -print -quit)"
          test -f "$BS"
          echo "BS=$BS" >> "$GITHUB_ENV"
      - name: Probe player shaders
        run: |
          set +e
          mkdir -p work/probe
          for F in globalgamemanagers.assets resources.assets sharedassets0.assets; do
            if [ -f "$DATA/$F" ]; then
              echo "=== $F ===" | tee -a work/probe/report.txt
              dotnet "$BS" shader-report "$DATA/$F" >> work/probe/report.txt 2>&1
              RC=$?
              echo "shader-report rc=$RC" | tee -a work/probe/report.txt
              dotnet "$BS" extract-vulkan-android "$DATA/$F" "work/probe/$F.android" >> work/probe/report.txt 2>&1
              echo "extract rc=$?" | tee -a work/probe/report.txt
            fi
          done

          echo "=== sample addressables ===" | tee -a work/probe/report.txt
          find "$DATA/StreamingAssets/aa/StandaloneWindows64" -type f -name '*.bundle' -printf '%s %p\n' | sort -n | head -20 > work/probe/sample-bundles.txt
          while read -r SIZE P; do
            echo "--- $P ($SIZE) ---" | tee -a work/probe/report.txt
            dotnet "$BS" shader-report "$P" >> work/probe/report.txt 2>&1
            echo "report rc=$?" | tee -a work/probe/report.txt
          done < work/probe/sample-bundles.txt
          set -e
          cat work/probe/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FFH-vulkan-probe
          path: work/probe
          retention-days: 7
